
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Practice connecting a notes app to an API.</p>
    </header>

    <main>
        <section>
            <h2>Your notes</h2>
            <button id="load-btn" type="button">Load notes</button>
            <p id="status" role="status" aria-live="polite">Ready to load notes.</p>
            <ul id="notes-list"></ul>
        </section>

        <section>
            <h2>Create a note</h2>
            <form id="note-form">
                <label for="title-input">Title</label>
                <input
                    id="title-input"
                    name="title"
                    type="text"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note body (optional)</label>
                <textarea
                    id="body-input"
                    name="body"
                    rows="4"
                ></textarea>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>
    </main>

    <footer>
        <p>QuickNotes — API client practice project.</p>
    </footer>
</body>
</html>
